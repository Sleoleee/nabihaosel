<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(220, 38, 38, 0.30),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(127, 29, 29, 0.40),
          transparent 42%
        ),
        #090202;

      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      padding: 42px;

      border-radius: 24px;

      border:
        1px solid
        rgba(248, 113, 113, 0.14);

      background:
        rgba(24, 7, 7, 0.92);

      backdrop-filter: blur(20px);

      box-shadow:
        0 35px 90px
        rgba(0, 0, 0, 0.55),
        0 0 60px
        rgba(220, 38, 38, 0.08);
    }

    .lock {
      width: 60px;
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 28px;

      border-radius: 17px;

      background:
        rgba(220, 38, 38, 0.14);

      border:
        1px solid
        rgba(248, 113, 113, 0.24);

      box-shadow:
        inset 0 0 20px
        rgba(239, 68, 68, 0.06);

      font-size: 26px;
    }

    .eyebrow {
      margin-bottom: 8px;

      color: #f87171;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.17em;
    }

    h1 {
      margin: 0;

      font-size: 30px;

      letter-spacing: -0.03em;
    }

    .description {
      margin:
        12px 0 32px;

      color: #a1a1aa;

      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #e4e4e7;

      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;

      padding:
        14px 15px;

      border:
        1px solid #3f1d1d;

      border-radius: 11px;

      outline: none;

      background: #120606;

      color: #ffffff;

      font-size: 14px;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
    }

    input::placeholder {
      color: #6b5252;
    }

    input:hover {
      border-color: #6b2a2a;
    }

    input:focus {
      border-color: #ef4444;

      background: #160707;

      box-shadow:
        0 0 0 3px
        rgba(239, 68, 68, 0.14);
    }

    button {
      width: 100%;

      margin-top: 7px;

      padding:
        14px 18px;

      border: 0;

      border-radius: 11px;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #ef4444,
          #b91c1c
        );

      color: #ffffff;

      font-size: 14px;
      font-weight: 700;

      box-shadow:
        0 10px 30px
        rgba(220, 38, 38, 0.22);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 14px 36px
        rgba(220, 38, 38, 0.32);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
      transform: none;
    }

    .error {
      display: none;

      margin-bottom: 16px;

      padding: 12px 14px;

      border:
        1px solid
        rgba(248, 113, 113, 0.25);

      border-radius: 10px;

      background:
        rgba(127, 29, 29, 0.24);

      color: #fca5a5;

      font-size: 13px;
    }

    .footer {
      margin-top: 28px;

      padding-top: 20px;

      border-top:
        1px solid
        rgba(248, 113, 113, 0.10);

      text-align: center;

      color: #7f5a5a;

      font-size: 10px;

      letter-spacing: 0.12em;
    }

    @media (
      max-width: 520px
    ) {
      .card {
        padding:
          32px 24px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="lock">
        🔒
      </div>

      <div class="eyebrow">
        SECURE ACCESS
      </div>

      <h1>
        Sales Dashboard
      </h1>

      <p class="description">
        Masukkan username dan password
        untuk melanjutkan ke dashboard.
      </p>

      <form id="loginForm">

        <div class="field">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            name="username"
            type="text"
            placeholder="Masukkan username"
            autocomplete="username"
            required
            autofocus
          />

        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />

        </div>

        <div
          id="error"
          class="error"
        >
          Username atau password salah.
        </div>

        <button
          id="submitButton"
          type="submit"
        >
          Masuk Dashboard
        </button>

      </form>

      <div class="footer">
        PROTECTED DASHBOARD
      </div>

    </section>

  </main>

  <script>
    const form =
      document.getElementById(
        'loginForm'
      )

    const errorBox =
      document.getElementById(
        'error'
      )

    const button =
      document.getElementById(
        'submitButton'
      )

    form.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault()

        errorBox.style.display =
          'none'

        button.disabled = true

        button.textContent =
          'Memeriksa...'

        const username =
          document.getElementById(
            'username'
          ).value

        const password =
          document.getElementById(
            'password'
          ).value

        try {

          const response =
            await fetch(
              '/api/login',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json',
                },

                body:
                  JSON.stringify({
                    username,
                    password,
                  }),
              }
            )

          if (!response.ok) {
            throw new Error(
              'Login gagal'
            )
          }

          window.location.replace('/')

        } catch (error) {

          errorBox.style.display =
            'block'

          button.disabled = false

          button.textContent =
            'Masuk Dashboard'

        }

      }
    )
  </script>

</body>
</html>
