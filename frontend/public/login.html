<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(37, 99, 235, 0.25),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(30, 41, 59, 0.8),
          transparent 40%
        ),
        #020617;

      color: white;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      padding: 42px;

      border-radius: 24px;

      border:
        1px solid
        rgba(255,255,255,0.09);

      background:
        rgba(15,23,42,0.9);

      backdrop-filter: blur(20px);

      box-shadow:
        0 35px 90px
        rgba(0,0,0,0.5);
    }

    .lock {
      width: 60px;
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 28px;

      border-radius: 17px;

      background:
        rgba(59,130,246,0.12);

      border:
        1px solid
        rgba(96,165,250,0.20);

      font-size: 26px;
    }

    .eyebrow {
      margin-bottom: 8px;

      color: #60a5fa;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.17em;
    }

    h1 {
      margin: 0;

      font-size: 30px;

      letter-spacing: -0.03em;
    }

    .description {
      margin:
        12px 0 32px;

      color: #94a3b8;

      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #cbd5e1;

      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;

      padding:
        14px 15px;

      border:
        1px solid #334155;

      border-radius: 11px;

      outline: none;

      background: #0f172a;

      color: white;

      font-size: 14px;

      transition: 0.15s;
    }

    input::placeholder {
      color: #475569;
    }

    input:focus {
      border-color:
        #3b82f6;

      box-shadow:
        0 0 0 3px
        rgba(59,130,246,0.12);
    }

    button {
      width: 100%;

      margin-top: 7px;

      padding:
        14px 18px;

      border: 0;

      border-radius: 11px;

      cursor: pointer;

      background: #f8fafc;

      color: #020617;

      font-size: 14px;
      font-weight: 700;

      transition: 0.15s;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .error {
      display: none;

      margin-bottom: 16px;

      padding: 12px 14px;

      border:
        1px solid
        rgba(248,113,113,0.25);

      border-radius: 10px;

      background:
        rgba(127,29,29,0.18);

      color: #fca5a5;

      font-size: 13px;
    }

    .footer {
      margin-top: 28px;

      padding-top: 20px;

      border-top:
        1px solid
        rgba(255,255,255,0.07);

      text-align: center;

      color: #475569;

      font-size: 10px;

      letter-spacing: 0.12em;
    }

    @media (
      max-width: 520px
    ) {
      .card {
        padding:
          32px 24px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="lock">
        🔒
      </div>

      <div class="eyebrow">
        SECURE ACCESS
      </div>

      <h1>
        Sales Dashboard
      </h1>

      <p class="description">
        Masukkan username dan
        password untuk melanjutkan
        ke dashboard.
      </p>

      <form id="loginForm">

        <div class="field">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            name="username"
            type="text"
            placeholder="Masukkan username"
            autocomplete="username"
            required
            autofocus
          />

        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />

        </div>

        <div
          id="error"
          class="error"
        >
          Username atau password salah.
        </div>

        <button
          id="submitButton"
          type="submit"
        >
          Masuk Dashboard
        </button>

      </form>

      <div class="footer">
        PROTECTED DASHBOARD
      </div>

    </section>

  </main>

  <script>

    const form =
      document.getElementById(
        'loginForm'
      )

    const errorBox =
      document.getElementById(
        'error'
      )

    const button =
      document.getElementById(
        'submitButton'
      )

    form.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault()

        errorBox.style.display =
          'none'

        button.disabled = true
        button.textContent =
          'Memeriksa...'

        const username =
          document.getElementById(
            'username'
          ).value

        const password =
          document.getElementById(
            'password'
          ).value

        try {

          const response =
            await fetch(
              '/api/login',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json',
                },

                body:
                  JSON.stringify({
                    username,
                    password,
                  }),
              }
            )

          if (!response.ok) {
            throw new Error(
              'Login gagal'
            )
          }

          window.location.replace('/')

        } catch (error) {

          errorBox.style.display =
            'block'

          button.disabled = false

          button.textContent =
            'Masuk Dashboard'

        }

      }
    )

  </script>

</body>
</html>
