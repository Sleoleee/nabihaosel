<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard Access</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(220, 38, 38, 0.30),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(127, 29, 29, 0.40),
          transparent 42%
        ),
        #090202;

      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      padding: 44px;

      border-radius: 24px;

      border:
        1px solid
        rgba(248, 113, 113, 0.14);

      background:
        rgba(24, 7, 7, 0.92);

      backdrop-filter: blur(20px);

      box-shadow:
        0 35px 90px
        rgba(0, 0, 0, 0.55),
        0 0 60px
        rgba(220, 38, 38, 0.08);
    }

    .lock {
      width: 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 28px;

      border-radius: 18px;

      background:
        rgba(220, 38, 38, 0.14);

      border:
        1px solid
        rgba(248, 113, 113, 0.24);

      font-size: 28px;
    }

    .eyebrow {
      margin-bottom: 9px;

      color: #f87171;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.17em;
    }

    h1 {
      margin: 0;

      font-size: 30px;
      font-weight: 700;

      letter-spacing: -0.03em;
    }

    .description {
      margin:
        13px 0 32px;

      color: #a1a1aa;

      font-size: 14px;
      line-height: 1.7;
    }

    button {
      width: 100%;

      padding: 15px 18px;

      border: 0;
      border-radius: 11px;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #ef4444,
          #b91c1c
        );

      color: #ffffff;

      font-size: 14px;
      font-weight: 700;

      box-shadow:
        0 10px 30px
        rgba(220, 38, 38, 0.22);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 14px 36px
        rgba(220, 38, 38, 0.32);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 28px;

      padding-top: 20px;

      border-top:
        1px solid
        rgba(248, 113, 113, 0.10);

      text-align: center;

      color: #7f5a5a;

      font-size: 10px;
      letter-spacing: 0.12em;
    }

    @media (max-width: 520px) {
      .card {
        padding: 34px 24px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="lock">
        🔒
      </div>

      <div class="eyebrow">
        DASHBOARD ACCESS
      </div>

      <h1>
        Sales Dashboard
      </h1>

      <p class="description">
        Klik tombol di bawah untuk
        melanjutkan ke dashboard.
      </p>

      <button
        id="enterButton"
        type="button"
      >
        Masuk Dashboard
      </button>

      <div class="footer">
        SALES DASHBOARD
      </div>

    </section>

  </main>

  <script>
    const button =
      document.getElementById(
        'enterButton'
      )

    button.addEventListener(
      'click',
      () => {

        const secure =
          location.protocol === 'https:'
            ? '; Secure'
            : ''

        document.cookie =
          'dashboard_access=granted;' +
          ' Path=/;' +
          ' Max-Age=43200;' +
          ' SameSite=Lax' +
          secure

        window.location.replace('/')
      }
    )
  </script>

</body>
</html>
